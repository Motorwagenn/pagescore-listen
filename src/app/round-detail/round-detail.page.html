<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/rounds"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ round()?.title }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  @if (round(); as r) {
    <ion-list>
      @for (group of r.moods; track group.mood) {
        <ion-list-header>
          <ion-label>{{ group.mood }}</ion-label>
        </ion-list-header>
        @for (clip of group.clips; track clip.n) {
          <ion-item>
            <ion-label>Clip {{ clip.n }}</ion-label>
            <ion-button slot="end" fill="clear" (click)="toggle(clip)">
              <ion-icon slot="icon-only" [name]="playing() === clip.n ? 'pause' : 'play'"></ion-icon>
            </ion-button>
          </ion-item>

          <ion-item>
            <ion-segment [value]="ratingService.get(id(), clip.n)?.fits"
                        (ionChange)="setFits(clip, $any($event.detail.value))">
              <ion-segment-button value="yes"><ion-label>Fits</ion-label></ion-segment-button>
              <ion-segment-button value="no"><ion-label>Doesn't fit</ion-label></ion-segment-button>
            </ion-segment>
          </ion-item>

          <ion-item>
            <ion-segment [value]="ratingService.get(id(), clip.n)?.quality"
                        (ionChange)="setQuality(clip, $any($event.detail.value))">
              <ion-segment-button value="good"><ion-label>Good</ion-label></ion-segment-button>
              <ion-segment-button value="ok"><ion-label>Ok</ion-label></ion-segment-button>              
              <ion-segment-button value="bad"><ion-label>Bad</ion-label></ion-segment-button>
            </ion-segment>
          </ion-item>
        }
      }
    </ion-list>
  }
</ion-content>
