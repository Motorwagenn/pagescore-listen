<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Rounds</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Rounds</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-list>
    @for (round of rounds(); track round.id) {
      <ion-item>
        <ion-label>{{ round.title }}</ion-label>
      </ion-item>
    }
  </ion-list>
</ion-content>
