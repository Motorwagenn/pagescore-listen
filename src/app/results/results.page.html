<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Results | {{ ratingService.all().length }} clips rated</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    @for (r of ratingService.all(); track r.roundId + r.n) {
      <ion-item>
        <ion-label>
          <h2>{{ r.roundId }} | Clip:  {{ r.n }}</h2>
          <p>fits: {{ r.fits ?? '-' }} | quality: {{ r.quality ?? '-' }}</p>
        </ion-label>
      </ion-item>
    } @empty {
      <ion-item>
        <ion-label>No ratings yet</ion-label>
      </ion-item>
    }
  </ion-list>
</ion-content>
